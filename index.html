<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Zhilas بلیاردی ژیلاس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ڕەنگی نێلی تۆخ */
            --bg-deep: #0a1128;
            --card-deep: #16213e;
            --accent: #4cc9f0;
            --danger: #f72585;
            --text-light: #e0e0e0;
            --border: #1f4068;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-deep); 
            color: var(--text-light);
            margin: 0; padding: 20px;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h2 { color: var(--accent); font-size: 28px; letter-spacing: 2px; }

        .btn-main { background: var(--accent); color: var(--bg-deep); border: none; padding: 15px 30px; border-radius: 50px; font-weight: 900; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(76, 201, 240, 0.3); }

        .card { 
            background: var(--card-deep); border: 1px solid var(--border); padding: 20px; border-radius: 20px; margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 10px 0; }
        
        .btn-del { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        
        .grid-orders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .btn-item { background: #1b305c; color: white; border: 1px solid var(--accent); padding: 8px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <header><h2>بلیاردی ژیلەس</h2></header>
    <button class="btn-main" onclick="addTable()">+ مێزی نوێ</button>
    <div id="active-tables"></div>

    <div class="card">
        <h3>📜 مێژووی ئەمڕۆ</h3>
        <div id="history-list"></div>
    </div>

    <script>
        let tables = JSON.parse(localStorage.getItem('zhilas_tables')) || [];
        let history = JSON.parse(localStorage.getItem('zhilas_history')) || [];

        function render() {
            const container = document.getElementById('active-tables');
            container.innerHTML = '';
            tables.forEach((t, index) => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${t.name} - ${t.games} یاری</h3>
                        <div class="grid-orders">
                            <button class="btn-item" onclick="addOrder(${index}, 'ئاو')">ئاو</button>
                            <button class="btn-item" onclick="addOrder(${index}, 'ڕێد')">ڕێد</button>
                            <button class="btn-item" onclick="finish(${index})">داخستن</button>
                        </div>
                    </div>
                `;
            });

            const hist = document.getElementById('history-list');
            hist.innerHTML = '';
            history.forEach((h, index) => {
                hist.innerHTML += `
                    <div class="item-row">
                        <span>${h.name} - ${h.price} د.ع</span>
                        <button class="btn-del" onclick="deleteHistory(${index})">سڕینەوە</button>
                    </div>
                `;
            });
        }

        function addTable() {
            let name = prompt("ناوی کڕیار:");
            if(name) { tables.push({name, games: 1, total: 500}); save(); }
        }

        function finish(index) {
            if(confirm("دڵنیایت لە داخستنی مێزەکە؟")) {
                history.push(tables[index]);
                tables.splice(index, 1);
                save();
            }
        }

        // ئەمە ئەو بەشەیە بۆ سڕینەوەی تاکە تۆمار
        function deleteHistory(index) {
            if(confirm("دڵنیایت ئەم تۆمارە دەسڕیتەوە؟")) {
                history.splice(index, 1);
                save();
            }
        }

        function save() { 
            localStorage.setItem('zhilas_tables', JSON.stringify(tables));
            localStorage.setItem('zhilas_history', JSON.stringify(history));
            render(); 
        }

        render();
    </script>
</body>
</html>
