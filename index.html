<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلیاردی ژیلەس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #10b981; --text: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .tab { cursor: pointer; color: #94a3b8; padding: 5px 10px; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 10px; border-radius: 12px; text-align: center; font-size: 14px; }
        .stat-card b { display: block; color: var(--primary); font-size: 18px; }

        .btn-add { background: var(--primary); color: #000; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        
        .content { display: none; }
        .content.active { display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 style="text-align: center;">بلیاردی ژیلەس</h2>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('tables')">مێزەکان</div>
        <div class="tab" onclick="switchTab('daily')">ڕۆژانە</div>
        <div class="tab" onclick="switchTab('expenses')">خەرجی</div>
    </div>

    <div class="stats-row">
        <div class="stat-card">داهات<b id="inc">0</b></div>
        <div class="stat-card">خەرجی<b id="exp">0</b></div>
        <div class="stat-card">مێز<b id="count">0</b></div>
    </div>

    <button class="btn-add">+ مێزی نوێ دابمەزرێنە</button>

    <div id="tables-content" class="content active">
        <p style="text-align: center; color: #64748b; margin-top: 50px;">هیچ مێزێک کراوە نییە</p>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabName + '-content').classList.add('active');
    }
</script>

</body>
</html>
