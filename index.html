<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلیاردی ژیلەس - سیستەمی پرۆفیشناڵ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; --card: #1e293b; --danger: #ff4757; --text: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; }
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--card); flex: 1; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 5px solid var(--primary); }
        .btn { padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; margin: 3px; }
        .btn-add { background: var(--primary); color: #000; width: 100%; margin-bottom: 20px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--card); padding: 20px; border-radius: 20px; width: 85%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: none; margin: 10px 0; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0">بلیاردی ژیلاس Zhilas </h2>
        <button class="btn" onclick="openSettings()">⚙️ سیتینگ</button>
    </div>

    <div class="stats">
        <div class="stat-box">داهات<br><b id="inc">0</b></div>
        <div class="stat-box">خەرجی<br><b id="exp">0</b></div>
    </div>

    <button class="btn btn-add" onclick="openModal('table')">+ مێزی نوێ</button>
    <div id="tables-container"></div>

    <div id="modal" class="modal">
        <div class="modal-box">
            <h3 id="m-title"></h3>
            <input type="text" id="m-input" placeholder="بنووسە...">
            <button class="btn btn-add" onclick="saveData()">تۆمارکردن</button>
            <button class="btn" onclick="closeModal()">داخستن</button>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('zhilas_data')) || { tables: [], history: [], expenses: [] };

        function openModal(type) {
            document.getElementById('m-title').innerText = type === 'table' ? 'ناوی کڕیار' : 'بڕی خەرجی';
            document.getElementById('modal').style.display = 'flex';
            window.type = type;
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveData() {
            let val = document.getElementById('m-input').value;
            if(!val) return;
            if(window.type === 'table') state.tables.push({id: Date.now(), name: val, total: 0});
            else state.expenses.push(parseInt(val));
            save(); closeModal();
        }

        function add(id, price) {
            let t = state.tables.find(x => x.id === id);
            t.total += price; save();
        }

        function finish(id) {
            let idx = state.tables.findIndex(x => x.id === id);
            state.history.push(state.tables[idx]);
            state.tables.splice(idx, 1);
            save();
        }

        function undo() {
            if(state.history.length > 0) {
                state.tables.push(state.history.pop());
                save();
            }
        }

        function openSettings() {
            if(confirm("سیتینگ: \n1. کلیک OK بۆ گەڕاندنەوەی دواین مێز (Undo) \n2. کلیک Cancel بۆ سڕینەوەی هەموو داتاکان")) {
                undo();
            } else {
                if(confirm("دڵنیایت داتاکان دەسڕیتەوە؟")) {
                    state = { tables: [], history: [], expenses: [] };
                    save();
                }
            }
        }

        function save() {
            localStorage.setItem('zhilas_data', JSON.stringify(state));
            render();
        }

        function render() {
            document.getElementById('inc').innerText = state.history.reduce((a, b) => a + b.total, 0);
            document.getElementById('exp').innerText = state.expenses.reduce((a, b) => a + b, 0);
            
            let container = document.getElementById('tables-container');
            container.innerHTML = state.tables.map(t => `
                <div class="card">
                    <h3 style="margin:0">${t.name} | 💰 ${t.total} د.ع</h3>
                    <button class="btn" onclick="add(${t.id}, 500)">+ یاری</button>
                    <button class="btn" onclick="add(${t.id}, 500)">+ ئاو</button>
                    <button class="btn" onclick="add(${t.id}, 1000)">+ Red</button>
                    <button class="btn" onclick="add(${t.id}, 1000)">+ Dewi</button>
                    <button class="btn" onclick="add(${t.id}, 1000)">+ طوڕتە</button>
                    <button class="btn" onclick="add(${t.id}, 1000)">+ Asan</button>
                    <button class="btn" style="background:var(--danger)" onclick="finish(${t.id})">داخستن</button>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
