<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بلیاردی ژیلاس - سیستەمی پرۆفیشناڵ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #0a1128; --card-deep: #16213e; --accent: #4cc9f0; --danger: #f72585; --text: #e0e0e0; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-deep); color: var(--text); margin: 0; padding: 20px; }
        
        /* داشبۆرد */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card-deep); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); }
        
        /* مێزەکان */
        .card { background: var(--card-deep); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #1f4068; }
        .order-list { list-style: none; padding: 0; margin: 10px 0; color: #aaa; font-size: 14px; }
        
        /* دوگمەکان */
        .btn { background: var(--accent); border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        
        /* مۆدال (Popup) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-deep); padding: 30px; border-radius: 20px; text-align: center; border: 2px solid var(--accent); }
        input { padding: 10px; border-radius: 5px; border: none; width: 80%; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="stats">
        <div class="stat-card">داهات<br><b id="inc">0</b></div>
        <div class="stat-card">خەرجی<br><b id="exp">0</b></div>
        <div class="stat-card">قازانج<br><b id="pro">0</b></div>
    </div>

    <button class="btn" onclick="showModal()">+ کردنەوەی مێزی نوێ</button>

    <div id="active-tables"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>ناوی کڕیار بنووسە</h3>
            <input type="text" id="clientName" placeholder="ناوی کڕیار...">
            <br>
            <button class="btn" onclick="saveNewTable()">تۆمارکردن</button>
            <button class="btn" style="background:var(--danger)" onclick="hideModal()">داخستن</button>
        </div>
    </div>

    <script>
        let tables = JSON.parse(localStorage.getItem('zhilas_tables')) || [];
        let history = JSON.parse(localStorage.getItem('zhilas_history')) || [];
        let expenses = JSON.parse(localStorage.getItem('zhilas_expenses')) || [];

        function showModal() { document.getElementById('modal').style.display = 'flex'; }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }

        function saveNewTable() {
            let name = document.getElementById('clientName').value;
            if(name) { 
                tables.push({name, orders: [], games: 1, total: 500}); 
                save(); hideModal(); 
            }
        }

        function addOrder(i, item, price) {
            tables[i].orders.push({item, price});
            tables[i].total += price;
            save();
        }

        function finish(i) {
            history.push(tables[i]);
            tables.splice(i, 1);
            save();
        }

        function save() {
            localStorage.setItem('zhilas_tables', JSON.stringify(tables));
            localStorage.setItem('zhilas_history', JSON.stringify(history));
            render();
        }

        function render() {
            document.getElementById('inc').innerText = history.reduce((s, h) => s + h.total, 0);
            document.getElementById('exp').innerText = expenses.reduce((s, e) => s + e.amount, 0);
            document.getElementById('pro').innerText = (history.reduce((s, h) => s + h.total, 0) - expenses.reduce((s, e) => s + e.amount, 0));

            const container = document.getElementById('active-tables');
            container.innerHTML = '';
            tables.forEach((t, i) => {
                let orderList = t.orders.map(o => `<li>${o.item}: ${o.price}</li>`).join('');
                container.innerHTML += `
                    <div class="card">
                        <h3>👤 ${t.name} - ${t.total} د.ع</h3>
                        <ul class="order-list">${orderList}</ul>
                        <button class="btn" onclick="addOrder(${i}, 'ئاو', 500)">+ ئاو</button>
                        <button class="btn" onclick="addOrder(${i}, 'ڕێد', 1000)">+ ڕێد</button>
                        <button class="btn" style="background:var(--danger)" onclick="finish(${i})">داخستن</button>
                    </div>
                `;
            });
        }
        render();
    </script>
</body>
</html>
